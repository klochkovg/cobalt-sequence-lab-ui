<div class="card">
  <form (ngSubmit)="submit()">
    <label>
      Sequence
      <textarea name="sequence" [(ngModel)]="sequence"></textarea>
    </label>
    <button type="submit">Send</button>
  </form>

  @if (error(); as message) {
    <p class="error">Error: {{ message }}</p>
  }

  <pre class="result" [hidden]="result() === null">{{ result() | json }}</pre>
</div>
